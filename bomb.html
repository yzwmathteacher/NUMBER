<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字炸弹</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
        body{background:#1e293b;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
        .back{position:absolute;top:20px;left:20px;color:#fff;font-size:16px;cursor:pointer}
        .card{background:#fff;border-radius:22px;padding:30px;width:100%;max-width:460px;text-align:center}
        h1{color:#dc2626;margin-bottom:18px}
        .set-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
        .set-row input{width:100px;padding:10px;font-size:18px;text-align:center;border:1px solid #ccc;border-radius:8px}
        #setRange{background:#2563eb;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer}
        .range-show{font-size:24px;color:#1e293b;font-weight:bold;margin:20px 0;background:#fee2e2;padding:12px;border-radius:12px}
        #numInput{width:75%;padding:14px;font-size:22px;text-align:center;border:2px solid #94a3b8;border-radius:12px;margin-bottom:14px}
        .btn-group{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
        button{padding:12px 20px;border:none;border-radius:10px;font-size:16px;cursor:pointer}
        #submit{background:#22c55e;color:white}
        #restart{background:#64748b;color:white}
        .pop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center}
        .pop-box{background:#fff;padding:40px 30px;border-radius:16px;text-align:center;width:85%;max-width:360px}
        .pop h2{color:#dc2626;margin-bottom:16px}
        .pop p.punish{font-size:20px;color:#b91c1c;font-weight:bold;margin:15px 0;line-height:1.6}
        .pop button{background:#2563eb;color:white;margin:10px 8px}
    </style>
</head>
<body>
    <div class="back" onclick="location.href='index.html'">← 返回游戏首页</div>
    <div class="card">
        <h1>💣 数字炸弹（自定义区间）</h1>
        <div class="set-row">
            <input type="number" id="minSet" value="1">
            <span>~</span>
            <input type="number" id="maxSet" value="100">
            <button id="setRange">确认区间</button>
        </div>
        <div class="range-show" id="rangeText">当前范围：1 ~ 100</div>
        <input type="number" id="numInput" placeholder="输入猜测数字">
        <div class="btn-group">
            <button id="submit">提交猜测</button>
            <button id="restart">重置炸弹</button>
        </div>
        <div>猜测次数：<span id="count">0</span></div>
    </div>

    <div class="pop" id="popModal">
        <div class="pop-box">
            <h2>爆炸！踩到炸弹了！</h2>
            <p id="bombTip">本轮一共猜了0次</p>
            <p class="punish">惩罚：<span id="punishText"></span></p>
            <button id="nextRound">下一局</button>
            <button onclick="location.href='index.html'">返回首页</button>
        </div>
    </div>

<script>
    // 语音播报通用函数
    function voiceSpeak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "zh-CN";
        utter.rate = 0.95;
        utter.volume = 1;
        window.speechSynthesis.speak(utter);
    }

    // 扩充惩罚库
    const punishList = [
        "背诵本学期必背古诗两首", "大声朗读整篇课文2遍", "抄写本课生字20遍",
        "完整背诵一段文言文", "用5个本课成语造句子", "默写英语单词15个",
        "上台讲解一道数学例题", "朗读英语对话3遍", "背诵课文重点段落",
        "说出本节课3个知识点", "默写古诗全诗加注释", "朗读作文范文一段",
        "给全班讲一个搞笑小故事", "模仿三种小动物叫声30秒",
        "用三种不同语气朗读一句话", "上台做一分钟自我介绍",
        "唱一句课本里的歌曲", "夸身边三位同学的优点",
        "模仿老师讲课一分钟", "用方言读一段课文",
        "猜一个全班都能听懂的谜语", "比一个可爱的表情包动作",
        "分享一件今天开心的小事", "用夸张语气朗读词语",
        "原地做15个深蹲", "开合跳20次", "高抬腿30秒",
        "左右扭腰20下", "踮脚站立一分钟", "扩胸运动20次",
        "单脚站立10秒左右脚轮换", "原地踏步一分钟",
        "手臂绕环正反各15圈", "弯腰摸脚尖10次"
    ];
    function getRandomPunish(){
        return punishList[Math.floor(Math.random()*punishList.length)];
    }

    const minSet = document.getElementById("minSet");
    const maxSet = document.getElementById("maxSet");
    const setBtn = document.getElementById("setRange");
    const rangeText = document.getElementById("rangeText");
    const input = document.getElementById("numInput");
    const submit = document.getElementById("submit");
    const restart = document.getElementById("restart");
    const countDom = document.getElementById("count");
    const pop = document.getElementById("popModal");
    const bombTip = document.getElementById("bombTip");
    const punishText = document.getElementById("punishText");
    const nextRound = document.getElementById("nextRound");

    let minNum = 1, maxNum = 100;
    let bomb = 0, guessCount = 0;

    function newBomb(){
        minNum = Number(minSet.value);
        maxNum = Number(maxSet.value);
        if(minNum >= maxNum){
            alert("最小值必须小于最大值");
            voiceSpeak("输入错误，最小值不能大于等于最大值");
            return;
        }
        bomb = Math.floor(Math.random()*(maxNum-minNum+1)) + minNum;
        guessCount = 0;
        countDom.innerText = 0;
        rangeText.innerText = `当前范围：${minNum} ~ ${maxNum}`;
        voiceSpeak(`新游戏开始，数字范围${minNum}到${maxNum}`);
        input.value = "";
        pop.style.display = "none";
    }
    setBtn.onclick = newBomb;
    restart.onclick = newBomb;
    nextRound.onclick = newBomb;

    submit.onclick = ()=>{
        const val = Number(input.value);
        if(isNaN(val) || val<minNum || val>maxNum){
            alert(`请输入${minNum}到${maxNum}之间的数字`);
            voiceSpeak(`请输入${minNum}到${maxNum}区间内的数字`);
            return;
        }
        guessCount++;
        countDom.innerText = guessCount;
        if(val === bomb){
            const p = getRandomPunish();
            bombTip.innerText = `本轮一共猜了${guessCount}次`;
            punishText.innerText = p;
            pop.style.display = "flex";
            voiceSpeak(`爆炸！踩到炸弹，惩罚：${p}`);
        }else if(val < bomb){
            minNum = val + 1;
            rangeText.innerText = `当前范围：${minNum} ~ ${maxNum}`;
            voiceSpeak(`猜小了，现在范围是${minNum}到${maxNum}`);
        }else{
            maxNum = val - 1;
            rangeText.innerText = `当前范围：${minNum} ~ ${maxNum}`;
            voiceSpeak(`猜大了，现在范围是${minNum}到${maxNum}`);
        }
        input.value = "";
    }
    input.onkeydown = e=>e.key==="Enter"&&submit.click();
    newBomb();
</script>
</body>
</html>
