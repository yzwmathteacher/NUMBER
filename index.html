<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂互动小游戏合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #4F46E5, #818CF8);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #fff;
            font-size: 36px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }
        .game-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 16px;
        }
        .game-card h2 {
            font-size: 22px;
            color: #1E293B;
            margin-bottom: 10px;
        }
        .game-card p {
            color: #64748B;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 课堂互动游戏合集</h1>
        <div class="game-grid">
            <!-- 数字炸弹 -->
            <div class="game-card" onclick="location.href='bomb.html'">
                <div class="icon">💣</div>
                <h2>数字炸弹</h2>
                <p>多人课堂猜数字，只缩小范围不提示大小，内置惩罚机制，自定义数字区间</p>
            </div>
            <!-- 口算闯关 -->
            <div class="game-card" onclick="location.href='math.html'">
                <div class="icon">🔢</div>
                <h2>口算闯关练习</h2>
                <p>加减乘混合口算，自动判题计分，适合小学生日常计算训练</p>
            </div>
            <!-- 成语接龙 -->
            <div class="game-card" onclick="location.href='idiom.html'">
                <div class="icon">📜</div>
                <h2>成语接龙</h2>
                <p>语文课堂互动，四字成语接龙，自动校验首字，记录接龙历史</p>
            </div>
            <!-- 单词翻牌 -->
            <div class="game-card" onclick="location.href='wordcard.html'">
                <div class="icon">🔤</div>
                <h2>单词配对翻牌</h2>
                <p>中英单词记忆配对小游戏，锻炼英语单词记忆能力</p>
            </div>
        </div>
    </div>
</body>
</html>
